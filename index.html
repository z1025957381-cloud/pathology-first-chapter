<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f0">
  <meta name="description" content="病理学第一章：细胞和组织的适应与损伤互动课程">
  <title>细胞和组织的适应与损伤｜互动课程</title>
  <style>
:root {
  --canvas: #e8e7e1;
  --paper: #fbf8f0;
  --paper-2: #f4f0e6;
  --ink: #20332d;
  --muted: #6f7c75;
  --faint: #9aa39e;
  --line: #cbd1cc;
  --green: #275b4b;
  --green-soft: #dce9e2;
  --green-pale: #edf4f0;
  --amber: #9b6a2b;
  --amber-soft: #f3eadc;
  --shadow: rgba(36, 50, 44, .13);
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--canvas); color: var(--ink); }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100dvh;
  background:
    radial-gradient(circle at 12% 5%, rgba(255,255,255,.76), transparent 34rem),
    var(--canvas);
  font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  text-rendering: optimizeLegibility;
}
button { font: inherit; }
button:focus-visible { outline: 2px solid rgba(39,91,75,.55); outline-offset: 3px; }

.course-shell {
  display: grid;
  grid-template-columns: minmax(300px, 470px) 420px;
  align-items: center;
  justify-content: center;
  gap: clamp(50px, 8vw, 140px);
  min-height: 100dvh;
  padding: 24px 40px;
}

.course-desktop-intro { align-self: center; max-width: 470px; }
.course-desktop-intro > p {
  margin: 0 0 18px;
  color: var(--green);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .16em;
}
.course-desktop-intro h1 {
  margin: 0;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: clamp(42px, 5vw, 68px);
  line-height: 1.16;
  letter-spacing: -.035em;
}
.course-desktop-intro > span {
  display: block;
  max-width: 420px;
  margin-top: 24px;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.8;
}
.course-desktop-intro dl {
  display: flex;
  gap: 28px;
  margin: 42px 0 0;
  padding-top: 22px;
  border-top: 1px solid rgba(71,86,78,.22);
}
.course-desktop-intro dl div { display: grid; gap: 4px; }
.course-desktop-intro dt { color: var(--muted); font-size: 12px; }
.course-desktop-intro dd { margin: 0; color: var(--green); font-family: Georgia, serif; font-size: 30px; }

.course-phone {
  position: relative;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  width: 420px;
  height: min(890px, calc(100dvh - 48px));
  min-height: 680px;
  overflow: hidden;
  border: 1px solid rgba(43,66,56,.13);
  border-radius: 32px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,0) 18%),
    var(--paper);
  box-shadow: 0 28px 78px var(--shadow), 0 2px 8px rgba(36,50,44,.06);
}

.course-header {
  position: relative;
  z-index: 20;
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  min-height: 92px;
  padding: 20px 22px 15px;
  background: linear-gradient(180deg, rgba(251,248,240,.98), rgba(251,248,240,.9));
}
.course-header > button,
.course-header-actions > button {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--green);
  cursor: pointer;
}
.course-header svg { width: 20px; height: 20px; }
.course-header > div:nth-child(2) { min-width: 0; }
.course-header small {
  display: block;
  margin-bottom: 3px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .08em;
}
.course-header strong {
  display: block;
  overflow: hidden;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: 15px;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.course-header-actions { display: flex; align-items: center; gap: 3px; }
.course-header-actions > span { color: var(--faint); font-family: Georgia, serif; font-size: 12px; }
.course-header-actions .course-retry-entry { width: auto; min-width: 48px; padding: 0 6px; font-size: 13px; font-weight: 650; white-space: nowrap; }

.course-viewport {
  position: relative;
  min-height: 0;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.course-footer {
  position: relative;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 26px;
  padding: 4px 16px max(4px, env(safe-area-inset-bottom));
  background: var(--paper);
}
.course-footer > span { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }
.course-footer p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.4; white-space: nowrap; }

.stage-enter { animation: stage-enter .32s cubic-bezier(.2,.72,.24,1) both; }
@keyframes stage-enter {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Directory layer */
.directory-page {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  padding: 26px 30px 18px 34px;
  overflow-y: auto;
  /* Declare on the scroll container itself so touch swipes reach our handler. */
  touch-action: none;
  scrollbar-width: none;
}
.directory-page::-webkit-scrollbar { display: none; }
.directory-heading { flex: 0 0 auto; }
.directory-heading > small {
  display: block;
  color: var(--green);
  font-size: 11px;
  font-weight: 850;
  letter-spacing: .12em;
}
.directory-heading h1 {
  margin: 9px 0 0;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: 30px;
  line-height: 1.28;
  letter-spacing: -.02em;
}
.directory-heading > p:not(.previous-section-note) { margin: 11px 0 0; color: var(--muted); font-size: 12px; }
.previous-section-note {
  width: fit-content;
  margin: 0 0 18px;
  padding: 7px 10px;
  border-radius: 999px;
  background: var(--green-pale);
  color: var(--green);
  font-size: 10px;
  line-height: 1.4;
}
.chapter-tree,
.section-item-tree {
  --directory-node-size: 20px;
  --directory-node-border: 3px;
  --directory-node-color: #15666a;
  --directory-link-color: #b8c2bc;
  position: relative;
  display: grid;
  align-content: center;
  flex: 1 0 auto;
  min-height: 350px;
  margin-top: 20px;
}
.directory-rail {
  display: none;
}
.section-item-tree {
  --directory-node-size: 18px;
  --directory-node-border: 2.5px;
  --directory-link-color: #bdc7c1;
}
.chapter-section-row,
.section-item-row {
  position: relative;
  display: grid;
  grid-template-columns: var(--directory-node-size) minmax(0, 1fr) 20px;
  align-items: center;
  gap: calc(31px - var(--directory-node-size));
  min-height: 70px;
  padding: 7px 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
.chapter-section-row::before,
.chapter-section-row::after,
.section-item-row::before,
.section-item-row::after {
  content: "";
  position: absolute;
  z-index: 0;
  left: calc((var(--directory-node-size) - 1px) / 2);
  width: 1px;
  background: var(--directory-link-color);
  pointer-events: none;
}
.chapter-section-row::before,
.section-item-row::before { top: 0; bottom: 50%; }
.chapter-section-row::after,
.section-item-row::after { top: 50%; bottom: 0; }
.chapter-section-row:first-of-type::before,
.section-item-row:first-of-type::before,
.chapter-section-row:last-of-type::after,
.section-item-row:last-of-type::after { display: none; }
.chapter-section-row:disabled { cursor: default; pointer-events: none; }
.chapter-section-row:disabled > * { opacity: .42; }
.chapter-section-row > span:nth-child(2),
.section-item-row > span:nth-child(2) { min-width: 0; }
.chapter-section-row > span:nth-child(2) > small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.2;
}
.chapter-section-row strong,
.section-item-row strong {
  display: block;
  margin-top: 3px;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: 17px;
  line-height: 1.35;
}
.chapter-section-row em,
.section-item-row small {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 10px;
  font-style: normal;
}
.chapter-section-row > svg,
.section-item-row > svg { width: 16px; color: var(--faint); opacity: .55; }
.chapter-section-row.is-active strong,
.section-item-row.is-active strong { color: var(--green); font-size: 19px; }
.chapter-section-row.is-active > svg,
.section-item-row.is-active > svg { color: var(--green); opacity: 1; }

.course-progress-dot {
  position: relative;
  z-index: 2;
  display: block;
  width: var(--directory-node-size);
  height: var(--directory-node-size);
  border: var(--directory-node-border) solid var(--directory-node-color);
  border-radius: 50%;
  background: var(--paper);
  transition: background .3s ease, box-shadow .3s ease;
}
.course-progress-dot.is-started { background: linear-gradient(to top, var(--directory-node-color) 50%, var(--paper) 50%); }
.course-progress-dot.is-complete { border-color: #6b8f83; background: #6b8f83; }
.course-progress-dot.is-pending::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--directory-node-color); }
.course-progress-dot.is-review { border-color: var(--amber); }
.course-progress-dot.is-review::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--amber); }
.course-progress-dot.is-unavailable { border-style: dashed; background: var(--paper-2); }
.course-progress-dot.is-active { border-color: var(--directory-node-color); background: var(--directory-node-color); box-shadow: 0 0 0 5px rgba(21,102,106,.12); }
.course-progress-dot.is-active::after { display: none; }
.course-progress-dot.is-active.is-complete { border-color: #6b8f83; background: #6b8f83; box-shadow: 0 0 0 5px rgba(75,123,106,.13); }

.directory-primary-actions { display: grid; justify-items: center; gap: 10px; flex: 0 0 auto; padding-top: 14px; }
.primary-course-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  min-height: 50px;
  padding: 0 18px;
  border: 0;
  border-radius: 16px;
  background: var(--green);
  color: #fff;
  font-weight: 750;
  cursor: pointer;
}
.primary-course-button svg { width: 17px; }
.text-course-button {
  min-height: 34px;
  padding: 0 12px;
  border: 0;
  background: transparent;
  color: var(--green);
  font-size: 12px;
  font-weight: 750;
  cursor: pointer;
}

/* Knowledge layer */
.knowledge-page {
  position: relative;
  width: 100%;
  height: 100%;
  padding: 24px 30px 22px 42px;
  overflow: hidden;
}
.knowledge-path {
  position: absolute;
  top: 8px;
  left: 42px;
  z-index: 3;
  margin: 0;
  color: var(--green);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .04em;
}
.knowledge-history {
  position: absolute;
  top: 42px;
  right: 34px;
  left: 42px;
  z-index: 1;
  display: grid;
  gap: 9px;
  max-height: 132px;
  overflow: hidden;
}
.knowledge-history p {
  margin: 0;
  color: var(--muted);
  font-size: calc(13.5px - (var(--history-depth) - 1) * .8px);
  line-height: 1.45;
  opacity: calc(.66 - (var(--history-depth) - 1) * .18);
  transform: scale(calc(1 - (var(--history-depth) - 1) * .05));
  transform-origin: left top;
}
.current-knowledge {
  position: absolute;
  top: 50%;
  right: 30px;
  left: 42px;
  z-index: 2;
  max-height: 62%;
  padding: 8px 4px 18px 0;
  overflow-y: auto;
  scrollbar-width: thin;
  overscroll-behavior: contain;
  transform: translateY(-47%);
  user-select: text;
  -webkit-user-select: text;
}
.current-knowledge > small,
.question-heading > small {
  color: var(--green);
  font-size: 10px;
  font-weight: 850;
  letter-spacing: .1em;
}
.current-knowledge h2,
.question-heading h2 {
  margin: 10px 0 0;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: 25px;
  line-height: 1.35;
  letter-spacing: -.015em;
}
.approved-prose-body,
.approved-relation-body,
.approved-comparison-body { margin-top: 24px; }
.approved-prose-body p {
  margin: 0 0 13px;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: 19px;
  font-weight: 600;
  line-height: 1.72;
}
.approved-relation-body { display: grid; gap: 18px; }
.approved-relation-body > div {
  position: relative;
  display: grid;
  grid-template-columns: 12px minmax(0, 1fr);
  gap: 13px;
  align-items: start;
}
.approved-relation-body > div > span {
  width: 9px;
  height: 9px;
  margin-top: 9px;
  border: 1.5px solid var(--green);
  border-radius: 50%;
  background: var(--paper);
}
.approved-relation-body > div:not(:last-child)::after {
  content: "";
  position: absolute;
  top: 19px;
  bottom: -17px;
  left: 4px;
  width: 1px;
  background: var(--line);
}
.approved-relation-body p,
.approved-comparison-body p {
  margin: 0;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: 18px;
  font-weight: 600;
  line-height: 1.68;
}
.approved-comparison-body { display: grid; gap: 13px; }
.approved-comparison-body p {
  padding: 14px 0;
  border-top: 1px solid var(--line);
}
.approved-comparison-body p:last-child { border-bottom: 1px solid var(--line); }
.support-entry {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
  margin-top: 24px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--green);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}
.support-entry svg { width: 16px; }

/* Question layer */
.question-stage {
  position: absolute;
  top: 50%;
  right: 28px;
  left: 42px;
  z-index: 2;
  max-height: 72%;
  padding: 8px 5px 22px 0;
  overflow-y: auto;
  scrollbar-width: thin;
  overscroll-behavior: contain;
  transform: translateY(-46%);
  user-select: none;
}
.question-heading h2 { font-size: 21px; line-height: 1.48; }
.question-heading > p { margin: 11px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
.question-target-list,
.single-choice-list,
.comparison-answer-grid { display: grid; gap: 9px; margin-top: 22px; }
.question-target,
.single-choice-list > button {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 18px;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 55px;
  padding: 10px 13px;
  border: 1px solid rgba(75,93,84,.18);
  border-radius: 14px;
  background: rgba(255,255,255,.46);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
.question-target > span { color: var(--muted); font-size: 11px; line-height: 1.35; }
.question-target > strong { max-width: 155px; color: var(--green); font-size: 12px; line-height: 1.4; text-align: right; }
.question-target > svg { width: 15px; color: var(--faint); }
.question-target.is-filled { border-color: rgba(39,91,75,.42); background: var(--green-pale); }
.question-target.is-correct { border-color: var(--green); }
.question-target.is-review { border-color: rgba(155,106,43,.55); background: var(--amber-soft); }
.comparison-answer-grid { gap: 13px; }
.comparison-answer-grid article {
  padding: 13px 12px 4px;
  border-top: 1px solid var(--line);
}
.comparison-answer-grid h3 {
  margin: 0 0 10px;
  color: var(--green);
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: 15px;
}
.comparison-answer-grid .question-target { margin-bottom: 8px; }
.single-choice-list > button { grid-template-columns: 30px minmax(0, 1fr) 18px; }
.single-choice-list > button > span {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--muted);
  font-family: Georgia, serif;
  font-size: 12px;
}
.single-choice-list > button > strong { font-size: 13px; line-height: 1.45; }
.single-choice-list > button > svg { width: 17px; color: var(--green); }
.single-choice-list > button.is-selected { border-color: var(--green); background: var(--green-pale); }
.single-choice-list > button.is-answer > span { border-color: var(--green); background: var(--green); color: #fff; }
.question-actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.question-submit {
  flex: 1;
  min-height: 46px;
  border: 0;
  border-radius: 14px;
  background: var(--green);
  color: white;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}
.question-submit:disabled { cursor: default; opacity: .32; }
.question-reset {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 46px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: transparent;
  color: var(--green);
  font-size: 13px;
  cursor: pointer;
}
.question-reset svg { width: 14px; }
.question-reset:disabled { opacity: .45; cursor: default; }
.question-feedback {
  margin-top: 14px;
  padding: 14px 15px;
  border-left: 3px solid var(--green);
  border-radius: 4px 12px 12px 4px;
  background: var(--green-pale);
}
.question-feedback.is-review { border-left-color: var(--amber); background: var(--amber-soft); }
.question-feedback > strong { color: var(--green); font-size: 11px; }
.question-feedback.is-review > strong { color: var(--amber); }
.question-feedback p { margin: 7px 0 0; color: #52635b; font-size: 12px; line-height: 1.6; }
.question-feedback .answer-line { color: var(--ink); font-weight: 750; }

/* Completion */
.completion-page {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  padding: 38px 38px 30px;
  text-align: center;
}
.completion-orbit {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  margin-bottom: 19px;
  border: 1px solid var(--green);
  border-radius: 50%;
  box-shadow: 0 0 0 8px var(--green-soft);
}
.completion-orbit span { width: 13px; height: 13px; border-radius: 50%; background: var(--green); }
.completion-spark { width: 42px; height: 42px; margin-bottom: 18px; color: var(--green); }
.completion-page > small { color: var(--green); font-size: 10px; font-weight: 850; letter-spacing: .12em; }
.completion-page h1 { margin: 12px 0 0; font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif; font-size: 28px; }
.completion-page > p { max-width: 300px; margin: 13px 0 0; color: var(--muted); font-size: 13px; line-height: 1.72; }
.completion-page dl { display: flex; gap: 40px; margin: 30px 0 26px; }
.completion-page dl div { display: grid; gap: 5px; }
.completion-page dt { color: var(--muted); font-size: 10px; }
.completion-page dd { margin: 0; color: var(--green); font-family: Georgia, serif; font-size: 25px; }
.completion-page .primary-course-button { max-width: 290px; }
.completion-page .text-course-button { margin-top: 8px; }

/* Bottom sheets */
.course-sheet-layer {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
  touch-action: pan-y;
}
.course-sheet-backdrop {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  background: rgba(31,47,40,.22);
  backdrop-filter: blur(2px);
}
.course-sheet {
  position: relative;
  z-index: 1;
  width: 100%;
  max-height: 78%;
  padding: 18px 20px max(22px, env(safe-area-inset-bottom));
  border-radius: 24px 24px 0 0;
  background: #fdfaf2;
  box-shadow: 0 -18px 50px rgba(35,50,43,.18);
  animation: sheet-enter .26s ease both;
}
@keyframes sheet-enter { from { transform: translateY(100%); } to { transform: translateY(0); } }
.course-sheet header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 38px;
  align-items: start;
  gap: 12px;
  margin-bottom: 14px;
}
.course-sheet header small { color: var(--green); font-size: 10px; font-weight: 800; }
.course-sheet header h3 { margin: 5px 0 0; font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif; font-size: 19px; line-height: 1.35; }
.course-sheet header > button {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;

      answerText: extraction.answer,
      feedback: extraction.feedback,
      layout: blueprint.layout,
      targets: blueprint.targets,
    };
  };

  const getReviewQuestions = () => content.chapter_review.items.map((review) => {
    if (review.type === "reuse") {
      const source = extractionMap.get(review.source_extraction_id);
      if (!source) throw new Error(`未知复用题：${review.source_extraction_id}`);
      return buildQuestion(source, review.id);
    }
    const blueprint = blueprints[review.id];
    if (!blueprint) throw new Error(`缺少章末题结构：${review.id}`);
    return {
      id: review.id,
      prompt: presentation.question_prompts[review.id] || review.prompt,
      options: review.options,
      answerText: review.answer,
      feedback: review.feedback,
      layout: blueprint.layout,
      targets: blueprint.targets,
    };
  });
  const reviewQuestions = getReviewQuestions();

  class CourseApp {
    constructor(root) {
      this.root = root;
      this.view = "chapter";
      this.sectionId = learningSections[0].section_id;
      this.itemId = getSection(this.sectionId).items[0].directory_item_id;
      this.stageIndex = 0;
      this.reviewIndex = 0;
      this.startedItems = new Set();
      this.readItems = new Set();
      this.practices = {};
      this.mastery = {};
      this.resume = null;
      this.supportOpen = false;
      this.settingsOpen = false;
      this.motionDirection = 1;
      this.lastRenderKey = "";
      this.activeOption = null;
      this.drag = null;
      this.suppressClick = false;
      this.wheel = { lastAt: 0, amount: 0, stepped: false, scrolled: false, timer: null };
      this.load();
      this.bind();
      this.render();
    }

    bind() {
      this.root.addEventListener("click", (event) => this.handleClick(event));
      this.root.addEventListener("pointerdown", (event) => this.handlePointerDown(event));
      this.root.addEventListener("pointermove", (event) => this.handlePointerMove(event));
      this.root.addEventListener("pointerup", (event) => this.handlePointerUp(event));
      this.root.addEventListener("pointercancel", () => { this.drag = null; });
      this.root.addEventListener("wheel", (event) => this.handleWheel(event), { passive: false });
      this.root.addEventListener("keydown", (event) => this.handleKeydown(event));
    }

    load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (sectionMap.has(saved.sectionId)) this.sectionId = saved.sectionId;
        if (itemMap.has(saved.itemId)) this.itemId = saved.itemId;
        if (["chapter", "section", "knowledge", "completion", "review", "reviewComplete"].includes(saved.view)) this.view = saved.view;
        this.stageIndex = restoreStage(this.itemId, saved.stageIndex, saved.presentationRevision);
        if (Number.isInteger(saved.reviewIndex)) this.reviewIndex = Math.min(reviewQuestions.length - 1, Math.max(0, saved.reviewIndex));
        this.startedItems = new Set((saved.startedItems || []).filter((id) => itemMap.has(id)));
        this.readItems = new Set((saved.readItems || []).filter((id) => itemMap.has(id)));
        this.practices = saved.practices || {};
        this.mastery = saved.mastery || {};
        if (saved.resume && itemMap.has(saved.resume.itemId) && sectionMap.has(saved.resume.sectionId)) {
          this.resume = saved.resume;
          this.resume.stageIndex = restoreStage(this.resume.itemId, this.resume.stageIndex, saved.presentationRevision);
        }
      } catch {
        // 设备端旧记录损坏时，从安全初始状态继续。
      }
    }

    save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          presentationRevision: presentation.revision,
          view: this.view,
          sectionId: this.sectionId,
          itemId: this.itemId,
          stageIndex: this.stageIndex,
          reviewIndex: this.reviewIndex,
          startedItems: [...this.startedItems],
          readItems: [...this.readItems],
          practices: this.practices,
          mastery: this.mastery,
          resume: this.resume,
        }));
      } catch {
        // 存储不可用不应阻止学习。
      }
    }

    firstUnreadInSection(sectionId) {
      return getSection(sectionId).items.find((entry) => !this.readItems.has(entry.directory_item_id))?.directory_item_id;
    }

    firstUnreadLocation() {
      for (const section of learningSections) {
        const itemId = this.firstUnreadInSection(section.section_id);
        if (itemId) return { sectionId: section.section_id, itemId };
      }
      return null;
    }

    allRead() {
      return includedItemIds.every((id) => this.readItems.has(id));
    }

    chooseActiveItem(sectionId, preferred) {
      const directory = getSection(sectionId);
      if (preferred && directory.items.some((entry) => entry.directory_item_id === preferred)) return preferred;
      return this.firstUnreadInSection(sectionId) || directory.items[0].directory_item_id;
    }

    openSection(sectionId, preferredItemId, direction = 1) {
      this.motionDirection = direction;
      this.sectionId = sectionId;
      this.itemId = this.chooseActiveItem(sectionId, preferredItemId);
      this.stageIndex = 0;
      this.view = "section";
      this.closeOverlays();
      this.commit();
    }

    enterItem(itemId, requestedStage = 0, direction = 1) {
      this.motionDirection = direction;
      const section = findSectionForItem(itemId);
      if (!section) return;
      const item = getItem(itemId);
      const frames = getFrames(itemId);
      const maxStage = frames.length + (item.extraction ? 1 : 0) - 1;
      const stage = Math.min(Math.max(0, requestedStage), Math.max(0, maxStage));
      this.sectionId = section.section_id;
      this.itemId = itemId;
      this.stageIndex = stage;
      this.startedItems.add(itemId);
      this.resume = { sectionId: section.section_id, itemId, stageIndex: stage };
      this.view = "knowledge";
      this.closeOverlays();
      this.commit();
    }

    markRead(itemId) {
      this.readItems.add(itemId);
      this.startedItems.add(itemId);
    }

    returnToSectionAfterItem(completedItemId) {
      this.markRead(completedItemId);
      const directory = getSection(this.sectionId);
      const currentIndex = directory.items.findIndex((entry) => entry.directory_item_id === completedItemId);
      const after = directory.items.slice(currentIndex + 1).find((entry) => !this.readItems.has(entry.directory_item_id));
      const any = after || directory.items.find((entry) => !this.readItems.has(entry.directory_item_id) && entry.directory_item_id !== completedItemId);
      this.itemId = any?.directory_item_id || completedItemId;
      this.stageIndex = 0;
      this.view = "section";
      this.closeOverlays();
      this.commit();
    }

    advanceFromSection() {
      const unread = this.firstUnreadInSection(this.sectionId);
      if (unread) return this.enterItem(unread);
      const next = nextLearningSection(this.sectionId);
      if (next) return this.openSection(next.section_id);
      this.view = "completion";
      this.commit();
    }

    continueCourse() {
      if (this.allRead()) {
        this.view = "completion";
        return this.commit();
      }
      if (this.resume && !this.readItems.has(this.resume.itemId)) {
        return this.enterItem(this.resume.itemId, this.resume.stageIndex);
      }
      const next = this.firstUnreadLocation();
      if (next) this.openSection(next.sectionId, next.itemId);
    }

    step(direction) {
      if (this.supportOpen || this.settingsOpen || this.activeOption) return;
      this.motionDirection = direction;
      if (this.view === "chapter") {
        if (direction > 0) this.continueCourse();
        return;
      }
      if (this.view === "section") {
        if (direction < 0) { this.view = "chapter"; this.commit(); }
        else this.advanceFromSection();
        return;
      }
      if (this.view === "knowledge") {
        const item = getItem(this.itemId);
        const frames = getFrames(this.itemId);
        const finalStage = frames.length + (item.extraction ? 1 : 0) - 1;
        if (direction < 0) {
          if (this.stageIndex > 0) {
            this.stageIndex -= 1;
            this.resume = { sectionId: this.sectionId, itemId: this.itemId, stageIndex: this.stageIndex };
            this.commit();
          } else this.openSection(this.sectionId, this.itemId);
          return;
        }
        const lastKnowledge = frames.length - 1;
        if (this.stageIndex < finalStage) {
          if (this.stageIndex === lastKnowledge) this.markRead(this.itemId);
          this.stageIndex += 1;
          this.resume = { sectionId: this.sectionId, itemId: this.itemId, stageIndex: this.stageIndex };
          this.commit();
        } else this.returnToSectionAfterItem(this.itemId);
        return;
      }
      if (this.view === "completion") {
        if (direction < 0) this.openSection(learningSections.at(-1).section_id);
        else { this.reviewIndex = 0; this.view = "review"; this.commit(); }
        return;
      }
      if (this.view === "review") {
        if (direction < 0) {
          if (this.reviewIndex > 0) this.reviewIndex -= 1;
          else this.view = "completion";
        } else if (this.reviewIndex < reviewQuestions.length - 1) this.reviewIndex += 1;
        else this.view = "reviewComplete";
        this.commit();
        return;
      }
      if (this.view === "reviewComplete") {
        if (direction < 0) { this.reviewIndex = reviewQuestions.length - 1; this.view = "review"; }
        else this.view = "chapter";
        this.commit();
      }
    }

    back() {
      this.motionDirection = -1;
      if (this.activeOption) { this.activeOption = null; return this.commit(); }
      if (this.settingsOpen || this.supportOpen) { this.closeOverlays(); return this.commit(); }
      if (this.view === "section") this.view = "chapter";
      else if (this.view === "knowledge") return this.openSection(this.sectionId, this.itemId, -1);
      else if (this.view === "completion") this.view = "chapter";
      else if (this.view === "review") this.view = "completion";
      else if (this.view === "reviewComplete") this.view = "chapter";
      this.commit();
    }

    closeOverlays() {
      this.supportOpen = false;
      this.settingsOpen = false;
      this.activeOption = null;
    }

    questionForCurrentExtraction() {
      const extraction = getItem(this.itemId).extraction;
      return extraction ? buildQuestion(extraction) : null;
    }

    currentQuestion() {
      if (this.view === "review") return reviewQuestions[this.reviewIndex];
      if (this.view === "knowledge") {
        const item = getItem(this.itemId);
        if (item.extraction && this.stageIndex === getFrames(this.itemId).length) return buildQuestion(item.extraction);
      }
      return null;
    }

    recordFor(question) {
      return this.practices[question.id] || { values: question.targets.map(() => ""), submitted: false, correct: false };
    }

    selectQuestionValue(questionId, targetIndex, value) {
      const question = this.findQuestion(questionId);
      if (!question || !question.targets[targetIndex]) return;
      const record = this.recordFor(question);
      const values = [...record.values];
      while (values.length < question.targets.length) values.push("");
      values[targetIndex] = value;
      this.practices[question.id] = { values, submitted: false, correct: false };
      this.mastery[question.id] = "unknown";
      this.activeOption = null;
      this.commit();
    }

    submitQuestion(questionId) {
      const question = this.findQuestion(questionId);
      if (!question) return;
      const record = this.recordFor(question);
      if (record.values.length !== question.targets.length || record.values.some((value) => !value)) return;
      const correct = question.targets.every((target, index) => record.values[index] === target.answer);
      this.practices[question.id] = { values: record.values, submitted: true, correct };
      this.mastery[question.id] = correct ? "stable" : "needs_review";
      this.commit();
    }

    resetQuestion(questionId) {
      const question = this.findQuestion(questionId);
      if (!question) return;
      delete this.practices[question.id];
      delete this.mastery[question.id];
      this.activeOption = null;
      this.commit();
    }

    findQuestion(questionId) {
      const extraction = extractionMap.get(questionId);
      if (extraction) return buildQuestion(extraction);
      return reviewQuestions.find((question) => question.id === questionId) || null;
    }

    resetItemPractice() {
      const item = getItem(this.itemId);
      if (!item.extraction) return;
      delete this.practices[item.extraction.id];
      delete this.mastery[item.extraction.id];
      this.stageIndex = getFrames(this.itemId).length;
      this.resume = { sectionId: this.sectionId, itemId: this.itemId, stageIndex: this.stageIndex };
      this.view = "knowledge";
      this.closeOverlays();
      this.commit();
    }

    resetCurrentItem() {
      const item = getItem(this.itemId);
      this.readItems.delete(this.itemId);
      this.startedItems.delete(this.itemId);
      if (item.extraction) {
        delete this.practices[item.extraction.id];
        delete this.mastery[item.extraction.id];
      }
      this.resume = null;
      this.closeOverlays();
      this.openSection(this.sectionId, this.itemId);
    }

    resetReview() {
      for (const question of reviewQuestions) {
        delete this.practices[question.id];
        delete this.mastery[question.id];
      }
      this.reviewIndex = 0;
      this.view = "review";
      this.closeOverlays();
      this.commit();
    }

    resetChapter() {
      this.startedItems = new Set();
      this.readItems = new Set();
      this.practices = {};
      this.mastery = {};
      this.resume = null;
      this.sectionId = learningSections[0].section_id;
      this.itemId = getSection(this.sectionId).items[0].directory_item_id;
      this.stageIndex = 0;
      this.reviewIndex = 0;
      this.view = "chapter";
      this.closeOverlays();
      this.commit();
    }

    commit() {
      this.save();
      this.render();
    }

    itemStatus(itemId) {
      const item = getItem(itemId);
      const extractionId = item.extraction?.id;
      const practice = extractionId ? this.practices[extractionId] : null;
      if (this.readItems.has(itemId)) {
        if (extractionId && !practice?.submitted) return "pending";
        if (practice?.submitted && !practice.correct) return "review";
        return "complete";
      }
      if (this.startedItems.has(itemId)) return "started";
      return "unread";
    }

    sectionStatus(sectionId) {
      const directory = sectionMap.get(sectionId);
      if (!directory) return "unavailable";
      const ids = directory.items.map((item) => item.directory_item_id);
      const complete = ids.every((id) => this.readItems.has(id));
      if (complete && ids.some((id) => this.itemStatus(id) === "pending")) return "pending";
      if (complete && ids.some((id) => this.itemStatus(id) === "review")) return "review";
      if (complete) return "complete";
      if (ids.some((id) => this.startedItems.has(id))) return "started";
      return "unread";
    }

    dot(status, active = false) {
      return `<span class="course-progress-dot is-${esc(status)}${active ? " is-active" : ""}" aria-hidden="true"></span>`;
    }

    renderChapter() {
      const readCount = includedItemIds.filter((id) => this.readItems.has(id)).length;
      const rows = learningSections.map((section) => {
        const directory = sectionMap.get(section.section_id);
        const status = this.sectionStatus(section.section_id);
        const active = section.section_id === this.sectionId;
        let note = "";
        if (!directory) note = "<em>本轮暂不展开</em>";
        else if (status === "complete") note = "<em>已浏览</em>";
        else if (status === "pending") note = "<em>已浏览 · 待提取</em>";
        else if (status === "review") note = "<em>已浏览 · 需复习</em>";
        else if (status === "started") note = "<em>学习中</em>";
        return `<button type="button" class="chapter-section-row${active ? " is-active" : ""}" ${directory ? `data-action="select-section" data-section-id="${esc(section.section_id)}"` : "disabled"}>
          ${this.dot(status, active)}
          <span><small>${esc(section.number)}</small><strong>${esc(section.title)}</strong>${note}</span>
          ${directory ? icon("right") : ""}
        </button>`;
      }).join("");
      return `<section class="directory-page chapter-directory stage-enter" data-course-scrollable aria-label="本章目录">
        <div class="directory-heading"><small>第一章</small><h1>细胞和组织的适应与损伤</h1><p>已浏览 ${readCount}/${includedItemIds.length} 个目录项</p></div>
        <div class="chapter-tree"><span class="directory-rail" aria-hidden="true"></span>${rows}</div>
        <div class="directory-primary-actions">
          <button type="button" class="primary-course-button" data-action="continue-course">${this.allRead() ? "查看本章完成情况" : "继续学习"}${icon("down")}</button>
          ${this.allRead() ? '<button type="button" class="text-course-button" data-action="start-review">进入章末精选复习</button>' : ""}
        </div>
      </section>`;
    }

    renderSection() {
      const formal = getFormalSection(this.sectionId);
      const directory = getSection(this.sectionId);
      const allRead = directory.items.every((item) => this.readItems.has(item.directory_item_id));
      const activeId = allRead ? this.itemId : this.firstUnreadInSection(this.sectionId) || this.itemId;
      const rows = directory.items.map((entry) => {
        const status = this.itemStatus(entry.directory_item_id);
        const active = entry.directory_item_id === activeId;
        let note = "";
        if (active && !allRead) note = "接下来";
        else if (status === "complete") note = "已浏览";
        else if (status === "pending") note = "已浏览 · 待提取";
        else if (status === "review") note = "已浏览 · 需复习";
        else if (status === "started") note = "学习中";
        return `<button type="button" class="section-item-row${active ? " is-active" : ""}" data-action="select-item" data-item-id="${esc(entry.directory_item_id)}">
          ${this.dot(status, active)}
          <span><strong>${esc(entry.title)}</strong>${note ? `<small>${esc(note)}</small>` : ""}</span>${icon("right")}
        </button>`;
      }).join("");
      const next = nextLearningSection(this.sectionId);
      const buttonText = allRead ? (next ? `进入${next.number}` : "查看本章完成情况") : `进入「${getItemTitle(activeId)}」`;
      return `<section class="directory-page section-directory stage-enter" data-course-scrollable aria-label="${esc(directory.section_title)}目录">
        <div class="directory-heading">
          <small>${esc(formal.number)}</small><h1>${esc(formal.title)}</h1><p>${allRead ? "本节目录已浏览" : "本节目录"}</p>
        </div>
        <div class="section-item-tree"><span class="directory-rail" aria-hidden="true"></span>${rows}</div>
        <div class="directory-primary-actions"><button type="button" class="primary-course-button" data-action="continue-section">${esc(buttonText)}${icon("down")}</button></div>
      </section>`;
    }

    renderInline(text) {
      return String(text ?? "").split(/(\*\*.*?\*\*)/g).map((part) => {
        if (part.startsWith("**") && part.endsWith("**")) return `<strong class="medical-emphasis">${esc(part.slice(2, -2))}</strong>`;
        return esc(part);
      }).join("");
    }

    renderFrameBody(frame) {
      const inline = (text) => this.renderInline(text);
      const note = frame.note ? `<p class="knowledge-note">${inline(frame.note)}</p>` : "";
      if (frame.layout === "relation") {
        return `<div class="knowledge-relation">${frame.source_lines.map((line) => `<p>${inline(line)}</p>`).join('<span class="relation-step-arrow" aria-hidden="true">↓</span>')}<span class="relation-step-arrow" aria-hidden="true">↓</span><div class="relation-result">${inline(frame.result)}</div></div>${note}`;
      }
      if (frame.layout === "sequence") {
        return `<div class="knowledge-sequence">${frame.steps.map((step, index) => `<div class="sequence-step"><p>${inline(step)}</p>${index < frame.steps.length - 1 ? '<span aria-hidden="true">↓</span>' : ''}</div>`).join("")}</div>${note}`;
      }
      if (frame.layout === "facts") {
        return `<div class="knowledge-facts">${frame.lines.map((line) => `<p>${inline(line)}</p>`).join("")}</div>${note}`;
      }
      if (frame.layout === "examples") {
        return `<div class="knowledge-examples"><div class="example-lines">${frame.examples.map((line) => `<p>${inline(line)}</p>`).join("")}</div></div>${note}`;
      }
      if (frame.layout === "compare") {
        return `<div class="knowledge-comparison">${frame.groups.map((group) => `<section><h3>${inline(group.title)}</h3>${group.lines.map((line) => `<p>${inline(line)}</p>`).join("")}</section>`).join("")}</div>${note}`;
      }
      if (frame.layout === "grouped") {
        return `<div class="knowledge-groups">${frame.groups.map((group) => `<section><h3>${esc(group.title)}</h3><div class="knowledge-group-lines${group.columns === 2 ? " is-pair" : ""}">${group.lines.map((line) => `<p>${inline(line)}</p>`).join("")}</div></section>`).join("")}</div>${note}`;
      }
      return `<div class="knowledge-prose">${frame.paragraphs.map((paragraph) => `<p>${inline(paragraph)}</p>`).join("")}</div>${note}`;
    }

    renderHistory(frames) {
      const history = frames.slice(0, Math.min(this.stageIndex, frames.length)).slice(-1);
      if (!history.length) return "";
      return `<div class="knowledge-history" aria-label="已形成的知识">${history.map((frame, index) => {
        const depth = history.length - index;
        return `<p style="--history-depth:${depth};--history-order:${index}">${esc(frame.history_label)}</p>`;
      }).join("")}</div>`;
    }

    renderKnowledge(motionClass = "") {
      const item = getItem(this.itemId);
      const frames = getFrames(this.itemId);
      const isExtraction = item.extraction && this.stageIndex === frames.length;
      if (isExtraction) return `<section class="knowledge-page stage-enter ${motionClass}"><p class="knowledge-path">${esc(item.path_label)}</p>${this.renderHistory(frames)}${this.renderQuestion(buildQuestion(item.extraction))}</section>`;
      const frame = frames[Math.min(this.stageIndex, frames.length - 1)];
      const alignment = frame.layout === "prose" && frame.paragraphs.some((line) => line.replaceAll("**", "").length > 32) ? "left" : "center";
      return `<section class="knowledge-page stage-enter ${motionClass}"><p class="knowledge-path">${esc(item.path_label)}</p>${this.renderHistory(frames)}
        <article class="current-knowledge${frame.support ? " is-support" : ""}" data-course-scrollable data-frame-id="${esc(frame.id)}" data-layout="${esc(frame.layout)}" data-alignment="${alignment}">
          <h2>${esc(frame.title)}</h2>${this.renderFrameBody(frame)}
        </article>
      </section>`;
    }

    renderQuestion(question) {
      const record = this.recordFor(question);
      const values = [...record.values];
      while (values.length < question.targets.length) values.push("");
      const complete = values.length === question.targets.length && values.every(Boolean);
      const correct = question.targets.every((target, index) => values[index] === target.answer);
      let answerArea = "";
      if (question.layout === "single") {
        answerArea = `<div class="single-choice-list">${question.options.map((option, index) => {
          const selected = values[0] === option;
          const answer = question.targets[0].answer === option;
          return `<button type="button" class="${selected ? "is-selected" : ""}${record.submitted && answer ? " is-answer" : ""}" data-action="choose-single" data-question-id="${esc(question.id)}" data-value="${esc(option)}">
            <span>${String.fromCharCode(65 + index)}</span><strong>${esc(option)}</strong>${record.submitted && answer ? icon("check") : ""}
          </button>`;
        }).join("")}</div>`;
      } else if (question.layout === "comparison") {
        const groups = new Map();
        question.targets.forEach((target, index) => {
          const group = target.group || "";
          if (!groups.has(group)) groups.set(group, []);
          groups.get(group).push({ target, index });
        });
        answerArea = `<div class="comparison-answer-grid">${[...groups.entries()].map(([group, targets]) => `<article><h3>${esc(group)}</h3>${targets.map(({ target, index }) => this.renderQuestionTarget(question, target, index, values[index], record.submitted)).join("")}</article>`).join("")}</div>`;
      } else {
        answerArea = `<div class="question-target-list">${question.targets.map((target, index) => this.renderQuestionTarget(question, target, index, values[index], record.submitted)).join("")}</div>`;
      }
      const feedback = record.submitted ? `<div class="question-feedback ${correct ? "is-correct" : "is-review"}"><strong>${correct ? "关系已恢复" : "正确关系"}</strong>${correct ? "" : `<p class="answer-line">${esc(question.answerText)}</p>`}<p>${esc(question.feedback)}</p></div>` : "";
      return `<section class="question-stage" data-course-scrollable>
        <div class="question-heading"><small>主动提取 · 可暂时跳过</small><h2>${esc(question.prompt)}</h2></div>
        ${answerArea}
        <div class="question-actions">
          <button type="button" class="question-submit" data-action="submit-question" data-question-id="${esc(question.id)}" ${complete ? "" : "disabled"}>${record.submitted ? "再次确认" : "提交答案"}</button>
          <button type="button" class="question-reset" data-action="reset-question" data-question-id="${esc(question.id)}" ${(record.submitted || values.some(Boolean)) ? "" : "disabled"}>${icon("reset")}重做本题</button>
        </div>${feedback}
      </section>`;
    }

    renderQuestionTarget(question, target, index, value, submitted) {
      const stateClass = value ? " is-filled" : "";
      const reviewClass = submitted ? (value === target.answer ? " is-correct" : " is-review") : "";
      return `<button type="button" class="question-target${stateClass}${reviewClass}" data-action="open-option" data-question-id="${esc(question.id)}" data-target-index="${index}">
        <span>${esc(target.label)}</span><strong>${value ? esc(value) : "选择答案"}</strong>${icon("down")}
      </button>`;
    }

    renderCompletion() {
      const read = includedItemIds.filter((id) => this.readItems.has(id)).length;
      const answered = extractionIds.filter((id) => this.practices[id]?.submitted).length;
      return `<section class="completion-page stage-enter">
        <div class="completion-orbit"><span></span></div><small>第一章</small><h1>本章内容已浏览</h1>
        <p>目录学习与主动提取分别记录，你可以直接进入精选复习，也可以返回目录重看任一部分。</p>
        <dl><div><dt>目录项</dt><dd>${read}/${includedItemIds.length}</dd></div><div><dt>即时提取</dt><dd>${answered}/${extractionIds.length}</dd></div></dl>
        <button type="button" class="primary-course-button" data-action="start-review">开始精选复习${icon("down")}</button>
        <button type="button" class="text-course-button" data-action="go-chapter">返回章目录</button>
      </section>`;
    }

    renderReview() {
      const question = reviewQuestions[this.reviewIndex];
      return `<section class="knowledge-page review-page stage-enter"><p class="knowledge-path">第一章 · 章末精选复习</p>${this.renderQuestion(question)}</section>`;
    }

    renderReviewComplete() {
      const answered = reviewQuestions.filter((question) => this.practices[question.id]?.submitted).length;
      const stable = reviewQuestions.filter((question) => this.practices[question.id]?.submitted && this.practices[question.id]?.correct).length;
      return `<section class="completion-page stage-enter">${icon("spark", "completion-spark")}<small>章末精选复习</small><h1>本章复习已浏览</h1>
        <p>复习结果只记录作答状态，不改变正文的已浏览状态。</p>
        <dl><div><dt>已作答</dt><dd>${answered}/${reviewQuestions.length}</dd></div><div><dt>较稳定</dt><dd>${stable}/${reviewQuestions.length}</dd></div></dl>
        <button type="button" class="primary-course-button" data-action="go-chapter">返回章目录${icon("tree")}</button>
        <button type="button" class="text-course-button" data-action="reset-review">重新复习</button>
      </section>`;
    }

    renderSupportSheet() {
      if (!this.supportOpen) return "";
      const item = getItem(this.itemId);
      return `<div class="course-sheet-layer" data-overlay="support"><button type="button" class="course-sheet-backdrop" data-action="close-overlay" aria-label="关闭补充内容"></button>
        <section class="course-sheet support-sheet" role="dialog" aria-modal="true" aria-label="${esc(getItemTitle(this.itemId))}补充内容">
          <header><div><small>${esc(getItemTitle(this.itemId))}</small><h3>补充理解</h3></div><button type="button" data-action="close-overlay" aria-label="关闭">${icon("close")}</button></header>
          <div class="support-sheet-content" data-course-scrollable>${item.support_items.map((support) => `<article><h4>${esc(support.title)}</h4><p>${esc(support.body)}</p></article>`).join("")}</div>
        </section></div>`;
    }

    renderOptionSheet() {
      if (!this.activeOption) return "";
      const question = this.findQuestion(this.activeOption.questionId);
      if (!question) return "";
      const target = question.targets[this.activeOption.targetIndex];
      const selected = this.recordFor(question).values[this.activeOption.targetIndex] || "";
      return `<div class="course-sheet-layer" data-overlay="option"><button type="button" class="course-sheet-backdrop" data-action="close-option" aria-label="关闭选项"></button>
        <section class="course-sheet" role="dialog" aria-modal="true" aria-label="${esc(target.label)}">
          <header><div><small>选择答案</small><h3>${esc(target.label)}</h3></div><button type="button" data-action="close-option" aria-label="关闭">${icon("close")}</button></header>
          <div class="course-option-list" data-course-scrollable>${question.options.map((option) => `<button type="button" class="${selected === option ? "is-selected" : ""}" data-action="select-option" data-question-id="${esc(question.id)}" data-target-index="${this.activeOption.targetIndex}" data-value="${esc(option)}"><span>${esc(option)}</span>${selected === option ? icon("check") : ""}</button>`).join("")}</div>
        </section></div>`;
    }

    renderSettingsSheet() {
      if (!this.settingsOpen) return "";
      const reviewMode = this.view === "review" || this.view === "reviewComplete";
      const chapterMode = ["chapter", "section", "completion"].includes(this.view);
      const item = getItem(this.itemId);
      return `<div class="course-sheet-layer settings-layer" data-overlay="settings"><button type="button" class="course-sheet-backdrop" data-action="close-overlay" aria-label="关闭设置"></button>
        <section class="course-sheet settings-sheet" role="dialog" aria-modal="true" aria-label="学习设置">
          <header><div><small>重做与重学</small><h3>${chapterMode ? "本章学习" : reviewMode ? "章末精选复习" : esc(getItemTitle(this.itemId))}</h3></div><button type="button" data-action="close-overlay" aria-label="关闭">${icon("close")}</button></header>
          <div class="settings-actions">
            ${chapterMode ? `<button type="button" data-action="reset-chapter">${icon("reset")}<span><strong>从头重做本章</strong><small>清除本章阅读和作答记录，重新开始</small></span></button><button type="button" data-action="reset-review">${icon("reset")}<span><strong>重做章末复习</strong><small>只清除7道精选复习的作答记录</small></span></button>` : reviewMode ? `<button type="button" data-action="reset-review">${icon("reset")}<span><strong>重做章末复习</strong><small>只清除7道精选复习的作答记录</small></span></button>` : `
              <button type="button" data-action="relearn-item">${icon("book")}<span><strong>从头重学本目录项</strong><small>保留已有作答记录</small></span></button>
              ${item.extraction ? `<button type="button" data-action="redo-item-practice">${icon("reset")}<span><strong>重做本项提取</strong><small>只清除当前目录项的提取记录</small></span></button>` : ""}
              <button type="button" data-action="reset-item">${icon("close")}<span><strong>重置本目录项</strong><small>清除阅读与作答状态</small></span></button>`}
            ${chapterMode ? "" : `<button type="button" class="is-destructive" data-action="reset-chapter">${icon("reset")}<span><strong>重置整个章节</strong><small>清除本章全部学习记录</small></span></button>`}
          </div>
        </section></div>`;
    }

    headerInfo() {
      const item = getItem(this.itemId);
      const total = getFrames(this.itemId).length + (item.extraction ? 1 : 0);
      if (this.view === "chapter") return { title: "本章目录", index: "" };
      if (this.view === "section") return { title: getFormalSection(this.sectionId).title, index: "目录" };
      if (this.view === "knowledge") return { title: getItemTitle(this.itemId), index: `${Math.min(this.stageIndex + 1, total)}/${total}` };
      if (this.view === "completion") return { title: "本章完成", index: "" };
      if (this.view === "review") return { title: "章末精选复习", index: `${this.reviewIndex + 1}/${reviewQuestions.length}` };
      return { title: "复习完成", index: "" };
    }

    footerCue() {
      if (this.view === "chapter") return "滑动浏览目录 · 到底后上滑继续";
      if (this.view === "section") return getSection(this.sectionId).items.every((entry) => this.readItems.has(entry.directory_item_id)) ? "滑动浏览目录 · 到底后上滑进入下一阶段" : "滑动浏览目录 · 到底后上滑进入当前项";
      if (this.view === "knowledge") {
        const item = getItem(this.itemId);
        const frameCount = getFrames(this.itemId).length;
        if (item.extraction && this.stageIndex === frameCount) return "可作答，也可上滑返回本节目录";
        if (item.extraction && this.stageIndex === frameCount - 1) return "上滑进入核心提取";
        return "上滑继续";
      }
      if (this.view === "review") return "作答后上滑进入下一题";
      return "上滑继续";
    }

    renderMainView(motionClass = "") {
      if (this.view === "chapter") return this.renderChapter().replace("stage-enter", `stage-enter ${motionClass}`);
      if (this.view === "section") return this.renderSection().replace("stage-enter", `stage-enter ${motionClass}`);
      if (this.view === "knowledge") return this.renderKnowledge(motionClass);
      if (this.view === "completion") return this.renderCompletion().replace("stage-enter", `stage-enter ${motionClass}`);
      if (this.view === "review") return this.renderReview().replace("stage-enter", `stage-enter ${motionClass}`);
      return this.renderReviewComplete().replace("stage-enter", `stage-enter ${motionClass}`);
    }

    renderKey() {
      if (this.view === "knowledge") return `knowledge:${this.itemId}:${this.stageIndex}`;
      if (this.view === "section") return `section:${this.sectionId}`;
      if (this.view === "review") return `review:${this.reviewIndex}`;
      return this.view;
    }

    render() {
      const header = this.headerInfo();
      const nextKey = this.renderKey();
      const shouldMove = Boolean(this.lastRenderKey && this.lastRenderKey !== nextKey);
      const motionClass = shouldMove ? (this.motionDirection < 0 ? "motion-backward" : "motion-forward") : "";
      this.root.innerHTML = `<main class="course-shell">
        <aside class="course-desktop-intro"><p>病理学 · 第一章</p><h1>细胞和组织的<br>适应与损伤</h1><span>按教材目录逐层进入；内容直接展示，关键关系随滑动连续形成。</span>
          <dl><div><dt>目录项</dt><dd>${content.counts.directory_items}</dd></div><div><dt>展示步骤</dt><dd>${presentation.counts.presentation_frames}</dd></div><div><dt>核心提取</dt><dd>${content.counts.extractions}</dd></div></dl>
        </aside>
        <article class="course-phone" aria-label="病理学第一章互动课程">
          <header class="course-header"><button type="button" data-action="back" aria-label="返回上一级">${icon("left")}</button><div><small>病理学 · 第一章</small><strong>${esc(header.title)}</strong></div>
            <div class="course-header-actions">${header.index ? `<span>${esc(header.index)}</span>` : ""}<button type="button" class="course-retry-entry" data-action="open-settings" aria-label="重做与重学">重做</button></div></header>
          <div class="course-viewport" tabindex="0">${this.renderMainView(motionClass)}${this.renderOptionSheet()}${this.renderSettingsSheet()}
            ${!(this.supportOpen || this.settingsOpen || this.activeOption) ? `<nav class="course-step-controls" aria-label="学习导航"><button type="button" data-action="step-up" aria-label="上一项">${icon("up")}</button><button type="button" data-action="step-down" aria-label="下一项">${icon("down")}</button></nav>` : ""}
          </div>
          <footer class="course-footer"><span aria-hidden="true"></span><p>${esc(this.footerCue())}</p></footer>
        </article>
      </main>`;
      this.lastRenderKey = nextKey;
      this.layoutObserver?.disconnect();
      const page = this.root.querySelector('.knowledge-page');
      const current = page?.querySelector('.current-knowledge, .question-stage');
      if (current) {
        const syncHistory = () => page.style.setProperty('--current-height', `${current.offsetHeight}px`);
        syncHistory();
        this.layoutObserver = new ResizeObserver(syncHistory);
        this.layoutObserver.observe(current);
      }
    }

    handleClick(event) {
      if (this.suppressClick) {
        event.preventDefault();
        event.stopPropagation();
        this.suppressClick = false;
        return;
      }
      const actionEl = event.target.closest("[data-action]");
      if (!actionEl || !this.root.contains(actionEl)) return;
      const action = actionEl.dataset.action;
      if (actionEl.disabled) return;
      switch (action) {
        case "back": return this.back();
        case "step-up": return this.step(-1);
        case "step-down": return this.step(1);
        case "select-section": return this.openSection(actionEl.dataset.sectionId);
        case "continue-course": return this.continueCourse();
        case "start-review": this.reviewIndex = 0; this.view = "review"; return this.commit();
        case "go-chapter": this.view = "chapter"; return this.commit();
        case "select-item": return this.enterItem(actionEl.dataset.itemId);
        case "continue-section": return this.advanceFromSection();
        case "open-settings": this.settingsOpen = true; return this.commit();
        case "close-overlay": this.closeOverlays(); return this.commit();
        case "open-option": this.activeOption = { questionId: actionEl.dataset.questionId, targetIndex: Number(actionEl.dataset.targetIndex) }; return this.commit();
        case "close-option": this.activeOption = null; return this.commit();
        case "select-option": return this.selectQuestionValue(actionEl.dataset.questionId, Number(actionEl.dataset.targetIndex), actionEl.dataset.value);
        case "choose-single": return this.selectQuestionValue(actionEl.dataset.questionId, 0, actionEl.dataset.value);
        case "submit-question": return this.submitQuestion(actionEl.dataset.questionId);
        case "reset-question": return this.resetQuestion(actionEl.dataset.questionId);
        case "relearn-item": return this.enterItem(this.itemId, 0);
        case "redo-item-practice": return this.resetItemPractice();
        case "reset-item": return this.resetCurrentItem();
        case "reset-review": return this.resetReview();
        case "reset-chapter": return this.resetChapter();
      }
    }

    handlePointerDown(event) {
      const viewport = event.target.closest(".course-viewport");
      if (!viewport || event.button !== 0 || event.target.closest(".course-sheet-layer")) return;
      // Long directories scroll first; entering requires a fresh gesture at the edge.
      const directory = viewport.querySelector('.directory-page');
      const scrollable = directory || event.target.closest("[data-course-scrollable]") || viewport.querySelector('.current-knowledge, .question-stage');
      this.drag = { pointerId: event.pointerId, startY: event.clientY, lastY: event.clientY, scrollable, directory: !!directory, scrolled: false, edgeDistance: 0, viewport, captured: false };
    }

    handlePointerMove(event) {
      if (!this.drag || this.drag.pointerId !== event.pointerId) return;
      const delta = event.clientY - this.drag.lastY;
      this.drag.lastY = event.clientY;
      const scrollable = this.drag.scrollable;
      let remaining = delta;
      if (scrollable && scrollable.scrollHeight > scrollable.clientHeight + 2) {
        const before = scrollable.scrollTop;
        scrollable.scrollTop = Math.max(0, Math.min(scrollable.scrollHeight - scrollable.clientHeight, before - delta));
        const consumed = before - scrollable.scrollTop;
        remaining -= consumed;
        if (Math.abs(consumed) > .5) {
          this.drag.edgeDistance = 0;
          this.drag.scrolled = true;
        }
      }
      if (remaining * this.drag.edgeDistance < 0) this.drag.edgeDistance = 0;
      this.drag.edgeDistance += remaining;
      if (Math.abs(event.clientY - this.drag.startY) > 8) {
        if (!this.drag.captured) {
          try {
            this.drag.viewport.setPointerCapture(event.pointerId);
            this.drag.captured = true;
          } catch { /* pointer capture is optional */ }
        }
        event.preventDefault();
      }
    }

    handlePointerUp(event) {
      if (!this.drag || this.drag.pointerId !== event.pointerId) return;
      const distance = event.clientY - this.drag.startY;
      if (Math.abs(distance) > 8 || this.drag.captured) {
        this.suppressClick = true;
        setTimeout(() => { this.suppressClick = false; }, 90);
      }
      if (this.drag.captured) {
        try { this.drag.viewport.releasePointerCapture(event.pointerId); } catch { /* pointer capture is optional */ }
      }
      const edgeDistance = this.drag.edgeDistance;
      const directoryScrolled = this.drag.directory && this.drag.scrolled;
      this.drag = null;
      if (!directoryScrolled && Math.abs(edgeDistance) > 46) this.step(edgeDistance < 0 ? 1 : -1);
    }

    handleWheel(event) {
      const viewport = event.target.closest(".course-viewport");
      if (!viewport || event.target.closest(".course-sheet-layer")) return;
      const now = event.timeStamp;
      const isNew = now - this.wheel.lastAt > 260;
      if (isNew) Object.assign(this.wheel, { amount: 0, stepped: false, scrolled: false });
      this.wheel.lastAt = now;
      clearTimeout(this.wheel.timer);
      this.wheel.timer = setTimeout(() => Object.assign(this.wheel, { amount: 0, stepped: false, scrolled: false }), 300);
      event.preventDefault();
      if (this.wheel.stepped) return;
      const directory = viewport.querySelector('.directory-page');
      const scrollable = event.target.closest("[data-course-scrollable]") || viewport.querySelector('.current-knowledge, .question-stage, .directory-page');
      let remaining = event.deltaY;
      if (scrollable && scrollable.scrollHeight > scrollable.clientHeight + 2) {
        const before = scrollable.scrollTop;
        scrollable.scrollTop = Math.max(0, Math.min(scrollable.scrollHeight - scrollable.clientHeight, before + remaining));
        const consumed = scrollable.scrollTop - before;
        remaining -= consumed;
        if (Math.abs(consumed) > .5) {
          this.wheel.amount = 0;
          this.wheel.scrolled = true;
        }
      }
      if (directory && this.wheel.scrolled) return;
      if (remaining * this.wheel.amount < 0) this.wheel.amount = 0;
      this.wheel.amount += remaining;
      if (Math.abs(this.wheel.amount) >= 48) {
        this.wheel.stepped = true;
        this.step(this.wheel.amount > 0 ? 1 : -1);
      }
    }

    handleKeydown(event) {
      if (!event.target.closest(".course-viewport") || event.target.closest("button, [role=dialog]")) return;
      if (["ArrowDown", "PageDown", " "].includes(event.key)) { event.preventDefault(); this.step(1); }
      if (["ArrowUp", "PageUp"].includes(event.key)) { event.preventDefault(); this.step(-1); }
    }
  }

  window.__COURSE_APP__ = new CourseApp(document.getElementById("app"));
})();

</script>
</body>
</html>
